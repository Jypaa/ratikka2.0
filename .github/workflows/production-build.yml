name: Build, Strip Logs & Push to Deploy Branch

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Rakenna React-tuotantobuildi ilman source mapeja
        env:
          GENERATE_SOURCEMAP: false
        run: npm run build

      - name: Poista kaikki console-kutsut tuotantobundlesta
        run: |
          npm install -g terser
          while IFS= read -r file; do
            terser "$file" --compress drop_console=true -o "${file}.tmp"
            mv "${file}.tmp" "$file"
          done < <(find build -name "*.js" -type f)

      - name: Varmista ettei lokikutsuja jäänyt
        run: |
          if grep -rnE "console\.(log|debug|info|warn|error)\(" build/; then
            echo "VIRHE: Tuotantobundlesta löytyi console-kutsuja!"
            exit 1
          fi
          echo "OK: Kaikki lokikutsut on poistettu."

      - name: Puske valmis build deploy-haaraan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cd build
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b deploy
          git add -A
          git commit -m "Deploy build from ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy