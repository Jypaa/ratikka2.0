name: React Production Build (No Logs)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Asenna Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Rakenna React-tuotantobuildi ilman source mapeja
        env:
          GENERATE_SOURCEMAP: false
        run: npm run build:prod

      - name: Poista kaikki console-kutsut tuotantobundlesta
        run: |
          npm install -g terser
          while IFS= read -r file; do
            terser "$file" --compress "pure_funcs=['console.log','console.info','console.debug']" -o "${file}.tmp"
          done < <(find build -name "*.js" -type f)

      - name: Varmista ettei lokikutsuja jäänyt
        run: |
          if grep -rnE "console\.(log|debug|info)\(" build/; then
            echo "VIRHE: Tuotantobundlesta löytyi console-kutsuja!"
            exit 1
          fi
          echo "OK: Kaikki lokikutsut on poistettu."